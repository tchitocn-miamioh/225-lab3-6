
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tchitocn-dev-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tchitocn-dev
  template:
    metadata:
      labels:
        app: tchitocn-dev
    spec:
      containers:
      - name: nginx
        image: cithit/tchitocn:latest
        ports:
        - containerPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tchitocn-ingress
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: tchitocn-dev-service
            port:
              number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: tchitocn-dev-service
spec:
  type: ClusterIP
  selector:
    app: tchitocn-dev
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
